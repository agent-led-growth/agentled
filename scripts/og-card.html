<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #0b0d0c;
        font-family: "Space Grotesk", sans-serif;
        position: relative;
        overflow: hidden;
      }
      canvas { position: absolute; right: 0; top: 0; width: 760px; height: 630px;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.55) 30%, #000 68%); }
      .overlay {
        position: absolute; inset: 0;
        padding: 56px 64px 64px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .lockup { display: flex; align-items: center; gap: 14px; }
      .mark { width: 44px; height: 44px; background: #c8f04a; position: relative; flex: none; }
      .mark i { position: absolute; background: #14170f; }
      .mark .h { width: 22px; height: 6.4px; left: 11px; top: 18.8px; }
      .mark .v { width: 6.4px; height: 22px; left: 18.8px; top: 11px; }
      .word { font-weight: 700; font-size: 19.7px; line-height: 0.95; letter-spacing: -0.04em; color: #eef1ec; }
      h1 {
        font-weight: 700; font-size: 96px; line-height: 0.95;
        letter-spacing: -0.055em; color: #eef1ec; max-width: 12ch;
      }
      p { font-size: 27px; line-height: 1.4; color: #9aa097; max-width: 30ch; margin-top: 26px; }
      .url { font-family: "JetBrains Mono", monospace; font-size: 15px;
        letter-spacing: 0.2em; text-transform: uppercase; color: #6e746c; margin-top: 40px; }
    </style>
  </head>
  <body>
    <canvas id="cv"></canvas>
    <div class="overlay">
      <div class="lockup">
        <div class="mark"><i class="h"></i><i class="v"></i></div>
        <span class="word">AGENT-LED<br />GROWTH</span>
      </div>
      <div>
        <h1>Grow in the Age of AI</h1>
        <p>Research, experiments, and tools for the next generation of growth.</p>
        <div class="url">agentled.co</div>
      </div>
    </div>
    <script>
      // Same etched-traces geometry as the site, rendered as a single frame.
      const el = document.getElementById("cv");
      const w = 760, h = 630, dpr = 2;
      el.width = w * dpr; el.height = h * dpr;
      const ctx = el.getContext("2d");
      ctx.scale(dpr, dpr);
      const g = 34, cols = Math.floor(w / g), rows = Math.floor(h / g);
      const rnd = (a, b) => a + Math.random() * (b - a);
      const paths = [];
      const n = Math.round((w * h) / 26000);
      let guard = 0;
      while (paths.length < n && guard++ < n * 20) {
        let cx = Math.floor(rnd(0, cols)), cy = Math.floor(rnd(0, rows));
        const pts = [{ x: cx * g, y: cy * g }];
        let horiz = Math.random() < 0.5;
        const legs = Math.floor(rnd(3, 7));
        for (let k = 0; k < legs; k++) {
          const len = Math.floor(rnd(2, 7)) * (Math.random() < 0.5 ? -1 : 1);
          if (horiz) cx = Math.max(0, Math.min(cols, cx + len)); else cy = Math.max(0, Math.min(rows, cy + len));
          pts.push({ x: cx * g, y: cy * g });
          horiz = !horiz;
        }
        let total = 0;
        for (let k = 1; k < pts.length; k++) total += Math.abs(pts[k].x - pts[k-1].x) + Math.abs(pts[k].y - pts[k-1].y);
        if (total < 60) continue;
        paths.push(pts);
      }
      ctx.lineWidth = 1; ctx.strokeStyle = "rgba(200,240,74,0.13)";
      paths.forEach(pts => {
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
        ctx.stroke();
      });
      ctx.fillStyle = "rgba(200,240,74,0.45)";
      paths.forEach(pts => pts.forEach((p, i) => {
        const s = (i === 0 || i === pts.length - 1) ? 4 : 2.4;
        ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
      }));
      // A few lit segments, echoing the live pulses.
      ctx.save();
      ctx.lineWidth = 1.8; ctx.strokeStyle = "#dcff6b";
      ctx.shadowColor = "rgba(200,240,74,0.9)"; ctx.shadowBlur = 10;
      paths.filter(() => Math.random() < 0.35).forEach(pts => {
        const k = Math.floor(rnd(1, pts.length));
        ctx.beginPath(); ctx.moveTo(pts[k-1].x, pts[k-1].y); ctx.lineTo(pts[k].x, pts[k].y); ctx.stroke();
      });
      ctx.restore();
    </script>
  </body>
</html>
